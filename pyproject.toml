[project]
name = "petfood-rag"
version = "0.1.0"
description = "LLM + RAG pet food recommender grounded in open-access veterinary literature"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "lxml>=5.2",
  "boto3>=1.34",
  "qdrant-client>=1.12,<1.13",   # match the Qdrant server version in docker-compose
  "fastembed>=0.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "moto[s3]>=5"]

[project.scripts]
petfood-ingest = "petfood.ingest.run:main"
petfood-index = "petfood.retrieval.cli:main"
petfood-answer = "petfood.recommend.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (DATABASE_URL)"]
